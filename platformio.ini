; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[board]
halfile = generic.h

[platformio]
default_envs = usb
description = Paxcounter is a device for metering passenger flows in realtime. It counts how many mobile devices are around.

[common]
release_version = 3.7.0
debug_level = 1
extra_scripts = pre:shared/build.py
otakeyfile = ota.conf
lorakeyfile = loraconf.h
lmicconfigfile = lmic_config.h
platform_espressif32 = espressif32@6.4.0
monitor_speed = 115200
upload_speed = 115200
lib_deps_lora = 
	mcci-catena/MCCI LoRaWAN LMIC library @ ^5.0.1
lib_deps_display = 
	bitbank2/OneBitDisplay @ ^2.3.2
	bitbank2/bb_spi_lcd @ 2.4.4
	ricmoo/QRCode @ ^0.0.1
lib_deps_ledmatrix = 
	seeed-studio/Ultrathin_LED_Matrix @ ^1.0.0
lib_deps_rgbled = 
	fastled/FastLED @ ^3.6.0
lib_deps_gps = 
	mikalhart/TinyGPSPlus @ ^1.0.3
lib_deps_sensors = 
	adafruit/Adafruit Unified Sensor @ ^1.1.14
	adafruit/Adafruit BME280 Library @ ^2.2.4
	adafruit/Adafruit BMP085 Library @ ^1.2.4
	adafruit/Adafruit BMP280 Library@ ^2.6.8
	boschsensortec/BSEC Software Library @ 1.8.1492
	lewapek/Nova Fitness Sds dust sensors library @ ^1.5.1
lib_deps_basic = 
	https://github.com/cyberman54/libpax.git
	https://github.com/SukkoPera/Arduino-Rokkit-Hash.git
	bblanchon/ArduinoJson @ ^6.21.5
	makuna/RTC @ ^2.5.0
	mathertel/OneButton @ ^2.5.0
	lewisxhe/XPowersLib @ ^0.2.6
	256dpi/MQTT @ ^2.5.2
lib_deps_all = 
	${common.lib_deps_basic}
	${common.lib_deps_display}
	${common.lib_deps_rgbled}
	${common.lib_deps_gps}
	${common.lib_deps_sensors}
	${common.lib_deps_ledmatrix}
build_flags_all = 
	-include "shared/paxcounter.conf"
	'-D CORE_DEBUG_LEVEL=${common.debug_level}'
	'-D LOG_LOCAL_LEVEL=${common.debug_level}'
	'-D PROGVERSION="${common.release_version}"'
	'-D LIBPAX_WIFI'
	'-D LIBPAX_BLE'
	'-D LIBPAX_ARDUINO'
	'-D USE_ESP_IDF_LOG'
	'-D TAG=__FILE__'
	'-U BOARD_HAS_PSRAM'
	'-U HAS_MQTT'
	'-U HAS_LORA'
	'-D MQTT_ETHERNET=0'
	'-D HAS_MQTT=0'

[env]
framework = arduino
board = esp32dev
board_build.partitions = min_spiffs.csv
build_type = release
platform = ${common.platform_espressif32}
lib_deps = ${common.lib_deps_all}
build_flags =
    -include "shared/hal/${board.halfile}"
    ${common.build_flags_all}
    -v
extra_scripts = ${common.extra_scripts}
monitor_speed = ${common.monitor_speed}
monitor_filters = time, esp32_exception_decoder, default

[env:ota]
upload_protocol = custom
lib_deps = esphome/ESPAsyncWebServer-esphome@^3.3.0

[env:usb]
upload_protocol = esptool
upload_speed = 115200
monitor_speed = 115200
upload_port = COM3
monitor_port = COM3
build_flags = 
	${common.build_flags_all}
	-include "shared/hal/${board.halfile}"
	${env.build_flags}
	-DCCACHE
	'-D OLED_TYPE=OLED_128x64'
	'-D OLED_ADDR=0x3C'
	'-D OLED_FREQUENCY=400000'
build_unflags = -Os
platform_packages = 
	toolchain-xtensa32 @ ~2.80400.0
build_type = release
extra_scripts = 
	${common.extra_scripts}
	pre:scripts/ccache.py
lib_deps = esphome/ESPAsyncWebServer-esphome@^3.3.0

[env:ci]
build_flags = 
	-include "shared/hal/${sysenv.CI_HALFILE}"
	${common.build_flags_all}
upload_protocol = esptool
lib_deps = esphome/ESPAsyncWebServer-esphome@^3.3.0

[env:generic_esp32]
extends = env:usb
build_flags = 
	${common.build_flags_all}
	-include "shared/hal/generic.h"
	${env.build_flags}
	-DCCACHE
	-DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
upload_speed = 115200
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
extra_scripts = 
	${common.extra_scripts}
	pre:scripts/ccache.py
lib_deps = 
	${common.lib_deps_all}
	knolleary/PubSubClient @ ^2.8
	rlogiacco/CircularBuffer @ ^1.3.3
	bblanchon/ArduinoJson @ ^6.21.3
	esphome/ESPAsyncWebServer-esphome@^3.3.0
	esphome/AsyncTCP-esphome@^2.1.1
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#2.0.14
board_build.filesystem = spiffs
